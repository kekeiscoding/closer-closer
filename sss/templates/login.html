{% extends 'base.html' %}
{% block title %}Sign in · ISATU - SSS{% endblock %}
{% block content %}
<div class="login-layout">
  <section class="login-identity" aria-label="University">
    <img class="login-photo" src="{{ url_for('static', filename='library.jpg') }}" width="1500" height="996" alt="">
    <img class="login-seal" src="{{ url_for('static', filename='isatu.png') }}" width="88" height="88" alt="">
    <p class="login-university">Iloilo Science and<br>Technology University</p>
    <p class="login-caption">Student Services System</p>
  </section>
  <section class="login-main">
    <div class="login-form">
      <h1>Sign in</h1>
      {% if error %}<p class="notice danger" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login') }}">
        {{ csrf() }}<input type="hidden" name="next" value="{{ destination }}">
        <label class="field"><span>Student ID or admin username</span>
          <input type="text" name="identity" autocomplete="username" value="{{ identity }}" required maxlength="120">
        </label>
        <label class="field"><span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required maxlength="200">
        </label>
        <button class="button primary" type="submit">Sign in</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
